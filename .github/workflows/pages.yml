name: Deploy site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        id: pages
      - name: Build name pages
        run: |
          BASE="${{ steps.pages.outputs.base_url }}"
          python3 babynamevault-upload/tools/gen_pages.py --base "$BASE"
          sed -i "s#https://SITE_URL_PLACEHOLDER#$BASE#g" babynamevault-upload/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: babynamevault-upload
      - id: deployment
        uses: actions/deploy-pages@v4
